<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halal Tokyo — Ikebukuro Restaurant Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name">Halal Tokyo</span>
      </div>
      <p class="header-tagline">Muslim-friendly dining spots, area by area</p>
    </div>
    <div class="pattern-strip" aria-hidden="true"></div>
  </header>

  <main>
    <section class="area-section">
      <div class="area-heading">
        <h1>池袋 <span class="area-en">Ikebukuro</span></h1>
        <p class="area-count" id="areaCount">— restaurants</p>
      </div>

      <div class="card-grid" id="cardGrid">
        <!-- Cards are generated by script.js from the restaurants array -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>প্রতিটি কার্ডে ক্লিক করলে সংশ্লিষ্ট রেস্টুরেন্টের ওয়েবসাইট নতুন ট্যাবে খুলবে।</p>
  </footer>

  <script src="./js/res.js"></script>
</body>
</html>
