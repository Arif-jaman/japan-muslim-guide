<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <section id="restaurants" class="restaurants">

        <h2>🍽 Halal Restaurants in Japan</h2>
        <p>Discover the best halal restaurants across Japan.</p>

        <div class="restaurant-container">

            <div class="restaurant-card">
                <img src="images/restaurant1.jpg" alt="Restaurant">
                <h3>Wagyu Panga</h3>
                <p>📍 Tokyo</p>
                <p>🥩 Japanese Halal Wagyu</p>
                <p>⭐ 4.8 / 5</p>
                <a href="#">View Details</a>
            </div>

            <div class="restaurant-card">
                <img src="images/restaurant2.jpg" alt="Restaurant">
                <h3>Halal Sakura</h3>
                <p>📍 Osaka</p>
                <p>🍜 Halal Ramen</p>
                <p>⭐ 4.6 / 5</p>
                <a href="#">View Details</a>
            </div>

            <div class="restaurant-card">
                <img src="images/restaurant3.jpg" alt="Restaurant">
                <h3>Istanbul Kebab</h3>
                <p>📍 Kyoto</p>
                <p>🥙 Turkish Food</p>
                <p>⭐ 4.7 / 5</p>
                <a href="#">View Details</a>
            </div>

        </div>

    </section>
</body>

</html>
