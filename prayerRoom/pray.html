<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Rooms</title>
</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer Rooms - Japan</title>
<style>
  :root{
    --ink:#1b2b28;
    --paper:#f4efe4;
    --deep-green:#0f3d3e;
    --gold:#b98a2f;
    --line: rgba(15,61,62,0.15);
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Noto Sans', 'Segoe UI', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .pattern{
    width:100%;
    height:10px;
    background:
      linear-gradient(135deg, var(--deep-green) 25%, transparent 25%) -5px 0,
      linear-gradient(225deg, var(--deep-green) 25%, transparent 25%) -5px 0;
    background-size:10px 10px;
    background-color:var(--gold);
  }

  header{
    text-align:center;
    padding:48px 20px 24px;
    max-width:640px;
  }
  header h1{
    font-size:2rem;
    margin:0 0 8px;
    color:var(--deep-green);
    letter-spacing:0.5px;
  }
  header p{
    margin:0;
    font-size:1.05rem;
    opacity:0.85;
    line-height:1.6;
  }

  main{
    width:100%;
    max-width:560px;
    padding:0 20px 60px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 24px;
    text-align:center;
    box-shadow:0 6px 20px rgba(15,61,62,0.06);
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 20px;
    font-size:1.05rem;
    font-weight:600;
    color:#fff;
    background:var(--deep-green);
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease;
  }
  .btn:hover{ background:#0c3132; transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .btn svg{ width:20px; height:20px; flex-shrink:0; }

  .status{
    margin-top:14px;
    font-size:0.92rem;
    min-height:1.2em;
    color:var(--deep-green);
  }
  .status.error{ color:#a33; }

  .manual{
    display:flex;
    gap:8px;
  }
  .manual input{
    flex:1;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:1rem;
    font-family:inherit;
  }
  .manual input:focus-visible{ outline:2px solid var(--gold); }
  .manual button{
    padding:12px 18px;
    border-radius:8px;
    border:none;
    background:var(--gold);
    color:#2a2000;
    font-weight:600;
    cursor:pointer;
  }
  .manual button:hover{ filter:brightness(0.95); }

  .section-title{
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--deep-green);
    opacity:0.7;
    margin:0 0 14px;
    text-align:left;
  }

  .mosque-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    text-align:left;
  }
  .mosque-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    text-decoration:none;
    color:var(--ink);
    transition:background .15s ease, transform .15s ease;
  }
  .mosque-item:hover{ background:#ece5d3; transform:translateX(2px); }
  .mosque-item .name{
    font-weight:600;
    font-size:0.98rem;
  }
  .mosque-item .region{
    font-size:0.82rem;
    opacity:0.65;
    display:block;
    margin-top:2px;
  }
  .mosque-item .arrow{
    opacity:0.5;
    flex-shrink:0;
    margin-left:10px;
  }

  footer{
    padding:20px;
    font-size:0.85rem;
    opacity:0.6;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .btn, .mosque-item{ transition:none; }
  }
</style>
</head>
<body>

  <div class="pattern"></div>

  <header>
    <h1>Prayer Rooms</h1>
    <p>Find a mosque or musalla (prayer space) near you in Japan.</p>
  </header>

  <main>
    <div class="card">
      <p class="section-title">Use your location</p>
      <button class="btn" id="locateBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>
        Find Nearby Mosques
      </button>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <p class="section-title">Or search by city / area</p>
      <div class="manual">
        <input type="text" id="placeInput" placeholder="e.g. Shinjuku, Tokyo">
        <button id="searchBtn">Search</button>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Well-known mosques in Japan</p>
      <div class="mosque-list" id="mosqueList"></div>
    </div>
  </main>

  <footer>Results open in Google Maps in a new tab. Prayer room availability at malls/airports can change — please confirm on arrival.</footer>

<script>
  const statusEl = document.getElementById('status');
  const locateBtn = document.getElementById('locateBtn');
  const placeInput = document.getElementById('placeInput');
  const searchBtn = document.getElementById('searchBtn');
  const mosqueListEl = document.getElementById('mosqueList');

  // A short list of well-established mosques across Japan.
  // Feel free to add more entries in this same format.
  const knownMosques = [
    { name: "Tokyo Camii", region: "Shibuya, Tokyo" },
    { name: "Otsuka Mosque", region: "Toshima, Tokyo" },
    { name: "Kobe Muslim Mosque", region: "Kobe, Hyogo" },
    { name: "Nagoya Mosque", region: "Nagoya, Aichi" },
    { name: "Osaka Ibaraki Mosque", region: "Ibaraki, Osaka" },
    { name: "Fukuoka Mosque", region: "Fukuoka" },
    { name: "Sendai Mosque", region: "Sendai, Miyagi" },
    { name: "Saitama Masjid", region: "Saitama" }
  ];

  function mapsSearchUrl(query){
    return 'https://www.google.com/maps/search/' + encodeURIComponent(query);
  }

  function renderMosqueList(){
    mosqueListEl.innerHTML = '';
    knownMosques.forEach(m => {
      const a = document.createElement('a');
      a.className = 'mosque-item';
      a.href = mapsSearchUrl(m.name + ' ' + m.region);
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `
        <span>
          <span class="name">${m.name}</span>
          <span class="region">${m.region}</span>
        </span>
        <span class="arrow">&#8250;</span>
      `;
      mosqueListEl.appendChild(a);
    });
  }
  renderMosqueList();

  locateBtn.addEventListener('click', () => {
    if(!navigator.geolocation){
      statusEl.textContent = 'Sorry, your browser does not support location.';
      statusEl.classList.add('error');
      return;
    }

    statusEl.classList.remove('error');
    statusEl.textContent = 'Finding your location...';

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        statusEl.textContent = 'Location found, opening map...';
        const url = `https://www.google.com/maps/search/mosque/@${latitude},${longitude},13z`;
        window.open(url, '_blank');
        statusEl.textContent = 'Nearby mosques are shown on the map.';
      },
      (err) => {
        statusEl.classList.add('error');
        if(err.code === err.PERMISSION_DENIED){
          statusEl.textContent = 'Location permission denied. Allow it in your browser settings, or search by city below.';
        } else {
          statusEl.textContent = 'Could not get your location. Try searching by city below.';
        }
      }
    );
  });

  function searchByPlace(){
    const place = placeInput.value.trim();
    if(!place){
      placeInput.focus();
      return;
    }
    window.open(mapsSearchUrl('mosque near ' + place + ', Japan'), '_blank');
  }

  searchBtn.addEventListener('click', searchByPlace);
  placeInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') searchByPlace();
  });
</script>

</body>
</html>
